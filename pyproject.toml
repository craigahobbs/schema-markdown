[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-markdown"
version = "1.3.2"
description = "A schema definition and validation library"
readme = "README.md"
license = "MIT"
keywords = ["schema", "validate", "json"]
authors = [
    {name = "Craig A. Hobbs", email = "craigahobbs@gmail.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities"
]

[project.urls]
Homepage = "https://github.com/craigahobbs/schema-markdown"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["schema_markdown"]
